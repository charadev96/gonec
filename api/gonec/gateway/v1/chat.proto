syntax = "proto3";

package gonec.gateway.v1;

import "gonec/shared/v1/auth.proto";
import "gonec/shared/v1/chat.proto";

service ChatService {
  rpc Send(SendRequest) returns (SendReply);
  rpc Listen(ListenRequest) returns (stream shared.v1.Message);
}

message SendRequest {
  shared.v1.Session auth = 1;
  string recipient = 2;
  string content = 3;
}

message SendReply {}

message ListenRequest {
  shared.v1.Session auth = 1;
}
